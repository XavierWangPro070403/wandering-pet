name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: 面向哪一端
      options:
        - Web 用户端
        - Web 机构端
        - Web 管理端
        - 微信小程序
        - 后端 / 接口
        - 其他
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下需要它？现在是怎么绕过去的？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 交互、接口或数据层面的想法都可以
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考资料
      description: 其他产品怎么做的、相关截图等
    validations:
      required: false
